name: Storybook image

# Each release tag builds ghcr.io/terjeballestad/bob-storybook:<version>.
# The homelab repo serves it at bob.godstemning.dev.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: storybook.Dockerfile
          push: true
          tags: ghcr.io/terjeballestad/bob-storybook:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
