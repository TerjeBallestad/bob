name: Release

# Push a tag v<version> to publish that version to npm. Trusted publishing
# (OIDC) authenticates the job, so no token or OTP is stored anywhere.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later. Node 22 ships npm 10.
      - run: npm install -g npm@11
      - name: The tag must match package.json
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json $v"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # 0.1.0 was published by hand before trusted publishing existed. A tag for a
      # version that is already on npm builds the Storybook image and publishes nothing.
      - name: Publish, unless this version is already on npm
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@terjeballestad/bob@$v" version >/dev/null 2>&1; then
            echo "$v is already on npm"
          else
            npm publish --access public
          fi
